id = "faraquet.slim"
name = "Slim"
version = "0.2.1"
description = "Slim highlighting with optional Ruby LSP navigation, hover and completion through ruby-lsp-slim."
authors = ["faraquet"]
homepage = "https://github.com/faraquet/openidea-slim"
license = "MIT"
categories = ["languages"]
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
activation = ["on-language:slim"]

[[contributes.languages]]
path = "languages/slim.toml"

[[contributes.fileIcons]]
id = "slim"
patterns = ["*.slim"]
icon = "icons/slim.svg"
